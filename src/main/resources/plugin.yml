name: VulcanoCraftResourcePackAssigner
main: be.vulcanosoftware.assignpack.AssignPack
version: 1.3
api-version: 1.20
commands:
  assignpack:
    description: Assign and stack resource packs for players
    usage: /assignpack <speler> [add|set|clear|remove|list] ...
    permission: assignpack.use
permissions:
  assignpack.use:
    description: Allows use of /assignpack
    default: op
