name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine Java version from pom.xml
        id: java-version
        run: |
          VERSION=$(grep -m1 -oP '(?<=<target>)[0-9]+(?=</target>)' pom.xml)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 -oP '(?<=<maven\.compiler\.target>)[0-9]+(?=</maven\.compiler\.target>)' pom.xml)
          fi
          if [ -z "$VERSION" ]; then
            echo "Kon geen Java-versie vinden in pom.xml" >&2
            exit 1
          fi
          echo "Gevonden Java-versie: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: VulcanoCraftResourcePackAssigner-jar
          path: target/*.jar
          retention-days: 3
